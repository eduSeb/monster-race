<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  
  <!-- PWA & Mobile Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4ADE80">
  
  <title>Monster Race - Math & Voix pour Maternelle</title>
  
  <!-- Google Fonts pour un look doux et lisible -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════════════ ÉCRAN D'ACCUEIL ══════════════════ -->
  <div id="screen-home" class="screen screen-home active">
    <!-- Décor de fond -->
    <div class="clouds"></div>
    <div class="clouds cloud-2"></div>
    
    <div class="home-panel">
      <h1 class="logo-title">
        <span class="logo-text">Monster</span> 
        <span class="logo-text accent">Race</span>
      </h1>
      <p class="subtitle">Utilise ta voix pour faire courir le monstre !</p>

      <!-- Section: Choix du personnage -->
      <div class="config-section">
        <div class="config-title">Choisis ton coureur :</div>
        <div class="monster-choices">
          <div class="monster-choice active" data-monster="A" id="choice-A"></div>
          <div class="monster-choice" data-monster="C" id="choice-C"></div>
          <div class="monster-choice" data-monster="D" id="choice-D"></div>
          <div class="monster-choice hidden" data-monster="E" id="choice-E" title="Légendaire !"></div>
        </div>
      </div>

      <!-- Section: Difficulté -->
      <div class="config-section">
        <div class="config-title">Jusqu'à combien sais-tu compter ?</div>
        <div class="level-selector">
          <button class="level-btn active" data-max="10">10</button>
          <button class="level-btn" data-max="20">20</button>
          <button class="level-btn" data-max="30">30</button>
          <button class="level-btn hidden" id="level-btn-secret" data-max="50" title="Master Level !">👑 50</button>
        </div>
      </div>

      <!-- Section: Vitesse du chrono -->
      <div class="config-section slider-section">
        <div class="config-title">
          Vitesse du monstre chrono
        </div>
        <input type="range" id="input-speed" min="2000" max="6000" step="500" value="4500" class="speed-slider" title="Plus le curseur est à gauche, plus le chrono va vite !">
        <div class="speed-labels">
          <span>Rapide 🏃💨</span>
          <span>Lent 🐢</span>
        </div>
      </div>

      <button id="btn-start" class="btn-primary pulse">Jouer !</button>
    </div>
  </div>

  <!-- ══════════════════ ÉCRAN DE JEU ══════════════════ -->
  <div id="screen-game" class="screen screen-game">
    
    <!-- Zone Piste (Monstres) -->
    <div class="track-area">
      <!-- Chemin du drapeau (décoration) -->
      <div class="finish-line">
        <div class="flag">🏁</div>
      </div>

      <div class="track track-player">
        <!-- SVG Monstre Joueur inséré en JS -->
        <div id="monster-player" class="monster-player"></div>
      </div>

      <!-- Zone bande de chiffres au centre -->
      <div class="number-strip-wrapper">
        <div id="number-strip" class="number-strip">
          <!-- Spans générés par JS -->
        </div>
      </div>

      <div class="track track-timer">
        <!-- SVG Monstre Timer inséré en JS -->
        <div id="monster-timer" class="monster-timer"></div>
      </div>
    </div>

    <!-- Zone Feedback & Contrôles -->
    <div class="control-area">
      <!-- Message : Bravo / Essaie encore -->
      <div id="feedback" class="feedback hidden">Bravo !</div>
      
      <!-- Bouton Micro -->
      <button id="btn-mic" class="btn-mic" aria-label="Appuie et parle !">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="21" x2="15" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="mic-label">Parle !</span>
      </button>
      <div id="listening-indicator" class="listening-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Bouton retour -->
    <button id="btn-back" class="btn-back" aria-label="Retour à l'accueil">← Accueil</button>

    <!-- Bouton Apprentissage -->
    <button id="btn-learn" class="btn-learn" aria-label="Ajouter une prononciation">
      <span class="learn-icon">🎓</span>
      <div class="learn-progress"></div>
    </button>
  </div>

  <!-- ══════════════════ ÉCRAN VICTOIRE ══════════════════ -->
  <div id="screen-win" class="screen screen-win">
    <div class="win-bg">
      <div class="confetti-container" id="confetti-container"></div>
    </div>
    <div class="win-content">
      <div id="win-monster-display" class="win-monster"></div>
      <h2 class="win-title">GAGNÉ !</h2>
      <p class="win-score">Tu es un champion des chiffres !</p>
      <button id="btn-replay" class="btn-primary">Rejouer</button>
    </div>
  </div>

  <!-- ══════════════════ ÉCRAN DÉFAITE ══════════════════ -->
  <div id="screen-lose" class="screen screen-lose">
    <div class="lose-content">
      <div id="lose-monster-display" class="win-monster lose-monster"></div>
      <h2 class="lose-title">Oups...</h2>
      <p class="win-score">Le requin violet t'a rattrapé !</p>
      <button id="btn-retry" class="btn-primary">Réessayer</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
